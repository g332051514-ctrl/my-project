name: Release

on:
  push:
    branches:
      - develop

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Auto-release from develop"
          title: "Publish from develop to main"
          body: "Automated PR generated by GitHub Actions"
          branch: develop
          base: main
          delete-branch: false
